name: Update Brave Adblock List

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build brave-adblock.txt
        run: |
          curl -s https://raw.githubusercontent.com/brave/adblock-resources/master/filter_lists/list_catalog.json -o catalog.json
          urls=$(jq -r '.[] | select(.default_enabled==true) | .sources[].url' catalog.json)
          echo "=== default_enabled=true URLs ==="
          echo "$urls"
          echo "================================="
          > brave-adblock.txt
          for u in $urls; do
            echo ">> Downloading: $u"
            if curl -fsSL --retry 3 "$u" >> brave-adblock.txt; then
              echo "" >> brave-adblock.txt
            else
              echo "!!! ERROR downloading: $u (skipping, not written to file)"
            fi
          done
          
          # Clean up lines starting with !
          sed -i '/^!/d' brave-adblock.txt
          
          # Get current time for Version and Last modified (Timezone UTC+7)
          VERSION=$(TZ='Asia/Ho_Chi_Minh' date +"%Y%m%d%H%M%S")
          LAST_MODIFIED=$(TZ='Asia/Ho_Chi_Minh' date +"%d %b %Y %H:%M:%S UTC+7")
          
          # Add info block to the top
          {
            echo "[Adblock Plus 2.0]"
            echo "! Title: Brave Shields Adblock filters"
            echo "! Version: $VERSION"
            echo "! Last modified: $LAST_MODIFIED"
            echo "! Expires: 12 hours (update frequency)"
            echo "! Description: Compiled from the 31 default filters of Brave Shields."
            echo "! GitHub: https://github.com/bibicadotnet/ublock-filters"
            echo "! Homepage: https://filters.bibica.net/brave-adblock.txt"
            cat brave-adblock.txt
          } > temp.txt && mv temp.txt brave-adblock.txt
          
          echo "Total lines in brave-adblock.txt: $(wc -l < brave-adblock.txt)"
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add brave-adblock.txt
          git diff --cached --quiet || git commit -m "Update brave-adblock.txt"
          git push
