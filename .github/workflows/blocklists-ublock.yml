name: Convert Blocklist Minimal

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build blocklists-minimal-ublock.txt
        run: |
          echo ">> Downloading raw domains..."
          curl -s https://raw.githubusercontent.com/bibicadotnet/blocklist_minimal/main/blocklists.txt -o raw_domains.txt
          
          echo ">> Converting to uBlock format..."
          # Convert domain to uBlock format (||domain^) and ignore empty lines (NF)
          awk 'NF {print "||"$1"^"}' raw_domains.txt > ublock_list.txt
          
          # Get current time for Version and Last modified (Timezone UTC+7)
          VERSION=$(TZ='Asia/Ho_Chi_Minh' date +"%Y%m%d%H%M%S")
          LAST_MODIFIED=$(TZ='Asia/Ho_Chi_Minh' date +"%d %b %Y %H:%M:%S UTC+7")
          
          echo ">> Adding info block..."
          # Add info block to the top
          {
            echo "[Adblock Plus 2.0]"
            echo "! Title: Blocklist Minimal (uBlock format)"
            echo "! Version: $VERSION"
            echo "! Last modified: $LAST_MODIFIED"
            echo "! Expires: 12 hours (update frequency)"
            echo "! Description: Domains from Blocklist Minimal converted to uBlock syntax."
            echo "! GitHub: https://github.com/bibicadotnet/ublock-filters"
            echo "! Homepage: https://filters.bibica.net/blocklists-minimal-ublock.txt"
            cat ublock_list.txt
          } > blocklists-minimal-ublock.txt
          
          echo "Total lines in blocklists-minimal-ublock.txt: $(wc -l < blocklists-minimal-ublock.txt)"
          
          # Clean up temporary files
          rm raw_domains.txt ublock_list.txt
          
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add blocklists-minimal-ublock.txt
          git diff --cached --quiet || git commit -m "Update blocklists-minimal-ublock.txt"
          git push
